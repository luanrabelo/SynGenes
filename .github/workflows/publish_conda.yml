name: Publish Python package to Anaconda

on: [push, pull_request]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Download and Install Anaconda
        run: |
          wget https://repo.anaconda.com/archive/Anaconda3-2023.07-1-Linux-x86_64.sh -O ~/anaconda.sh
          bash ~/anaconda.sh -b -p $HOME/anaconda
          echo "$HOME/anaconda/bin" >> $GITHUB_PATH  # Adiciona o Anaconda ao PATH
        shell: bash

      - name: Update Conda and Install Conda Build
        run: |
          source $HOME/anaconda/bin/activate
          conda update -n base -c defaults conda
          conda install -n base -c conda-forge conda-build
        shell: bash

      - name: Verify Conda Build Installation
        run: |
          source $HOME/anaconda/bin/activate
          conda list conda-build  # Verifica se o conda-build está instalado
        shell: bash

      - name: Build the Conda package
        env:
          CONDA_NO_PLUGINS: true
        run: |
          source $HOME/anaconda/bin/activate
          conda build conda-recipe
        shell: bash

      - name: Upload package to Anaconda
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          source $HOME/anaconda/bin/activate
          anaconda login --token $ANACONDA_API_TOKEN
          anaconda upload --skip-existing $HOME/anaconda/conda-bld/noarch/*.tar.bz2
        shell: bash
